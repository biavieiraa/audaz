<style>

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--frost);color:var(--deep);padding-bottom:76px}

header select{width:auto;min-height:44px;background:#fff;font-size:14px}
.pad{padding:16px;max-width:640px;margin:auto}section,.view{display:none}.on{display:block}
.photo{height:230px;background:url(hero.jpg) center/cover,linear-gradient(135deg,#2B6AAE,#5798D7 60%,#B9C255)}

label{display:block;margin:14px 0 4px;font-size:14px;color:var(--soft);font-weight:500;text-align:left}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;font:16px Inter,sans-serif;color:var(--deep);background:#F7FAFD;border:1px solid #7C93AB;border-radius:8px}
.btn{min-height:48px;min-width:44px;padding:10px 18px;border-radius:8px;font:600 16px Inter,sans-serif;cursor:pointer;border:2px solid var(--d7);margin:8px 8px 0 0}
.p{background:var(--d7);color:#fff}.s{background:#fff;color:var(--d7)}.t{background:var(--frost);color:var(--d7);border-color:transparent}
.a{background:var(--pist);color:var(--deep);border-color:var(--pist)}.big{width:100%;margin:20px 0 0}
.btn:disabled{background:#EEF2F6;color:#5F7389;border-color:#EEF2F6}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}.row .btn{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(15,42,68,.1)}
nav button{flex:1;min-height:60px;border:0;background:none;font:500 12px Inter,sans-serif;color:var(--soft);cursor:pointer;border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--d7);font-weight:600;border-top-color:var(--d7)}
.dots{display:flex;gap:8px;justify-content:center;margin:20px 0 12px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid #7C93AB}.dots i.on{background:var(--d7);border-color:var(--d7)}
.nav2{display:flex;justify-content:space-between}.nav2 .btn{margin:0}
iframe{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.err{color:var(--err);font-size:14px;text-align:left}.warn{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0;text-align:left}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font:600 17px Inter;color:var(--deep);cursor:pointer;text-align:left}
.item i{flex:none;width:48px;height:48px;border-radius:50%;background:var(--frost);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.stat{display:flex;gap:8px}.stat>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font:700 20px 'Bricolage Grotesque';color:var(--d7)}.stat span{font-size:12px;color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:1px;height:80px}.bars i{flex:1;background:var(--ice);min-height:2px;border-radius:2px 2px 0 0}
#msgs{min-height:45vh;display:flex;flex-direction:column}
.m{max-width:85%;padding:10px 12px;margin:5px 0;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--d7);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}.b{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:2px}
.say{background:none;border:0;font-size:18px;cursor:pointer;min-width:44px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{min-height:44px;padding:8px 12px;border-radius:22px;border:1px solid var(--d7);background:#fff;color:var(--d7);font:500 14px Inter;cursor:pointer}
#bar{position:sticky;bottom:68px;display:flex;gap:6px;background:var(--frost);padding:8px 0}#bar input{flex:1}#bar .btn{margin:0;padding:10px 14px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--frost);color:var(--d7)}
.months{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.mo h3{font-size:14px;margin:0 0 4px;text-transform:capitalize}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.g span{padding:2px 0;border-radius:3px;background:#F1F4D0}.g .h{background:none;color:var(--soft);font-weight:600}.g .e{background:none}
.g .p{background:var(--ice);color:var(--deep)}.g .s{background:var(--deep);color:#fff;font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0}summary{padding:14px 16px;font-weight:600;cursor:pointer;min-height:48px}details p{margin:0;padding:0 16px 14px}
.lbl{display:block;margin:14px 0 4px;font-size:14px;color:var(--soft);font-weight:500;text-align:left}
.soilnote{font-size:14px;text-align:left;margin:6px 0 10px;color:var(--soft)}
.soilnote b{color:var(--deep)}.soilnote small{display:block;margin-top:4px;font-size:12px}
.soils{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.soil{position:relative;display:flex;flex-direction:column;gap:4px;padding:0 0 10px;background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;font:inherit;color:var(--deep);text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.soil svg{display:block;width:100%;height:auto;transition:transform .4s}
.soil b{padding:0 10px;font-size:15px}.soil small{padding:0 10px;font-size:12px;color:var(--soft);line-height:1.35}
.soil:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(15,42,68,.14)}.soil:hover svg{transform:scale(1.05)}
.soil img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .4s}.soil:hover img{transform:scale(1.05)}
.soil[aria-pressed=true]{border-color:var(--d7);box-shadow:0 0 0 3px rgba(43,106,174,.25);animation:press .35s}
.soil[aria-pressed=true]::after{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--d7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pop .35s}
.soil .reg{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;background:var(--pist);color:var(--deep);padding:2px 8px;border-radius:10px}
.soilmore{grid-column:1/-1;margin:4px 0 0}
.soiltip{margin-top:12px;text-align:left}
.loadbar{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line),var(--ice),var(--line));background-size:200% 100%;animation:shimmer 1.2s linear infinite;margin:6px 0 10px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bubL{from{opacity:0;transform:translate(-10px,8px) scale(.95)}to{opacity:1;transform:none}}
@keyframes bubR{from{opacity:0;transform:translate(10px,8px) scale(.95)}to{opacity:1;transform:none}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes shimmer{to{background-position:-200% 0}}
.view.on{animation:fadeIn .35s ease}
.view.on .photo{animation:zoom 1.4s ease-out}
.view.on .sheet{animation:sheetUp .55s cubic-bezier(.2,.8,.2,1)}
#welcome.on .avatar{animation:pop .6s .2s both,float 3.2s 1s ease-in-out infinite}
#welcome.on h1{animation:fadeUp .5s .3s both}#welcome.on p{animation:fadeUp .5s .4s both}#welcome.on .btn{animation:fadeUp .5s .5s both}
.avatar.bump{animation:pop .35s}
.step{animation:slideL .4s cubic-bezier(.2,.8,.2,1)}#onb[data-dir=back] .step{animation-name:slideR}
.soils>*{animation:fadeUp .4s both}
.soils>:nth-child(2){animation-delay:.05s}.soils>:nth-child(3){animation-delay:.1s}.soils>:nth-child(4){animation-delay:.15s}.soils>:nth-child(5){animation-delay:.2s}.soils>:nth-child(6){animation-delay:.25s}.soils>:nth-child(7){animation-delay:.3s}.soils>:nth-child(8){animation-delay:.35s}.soils>:nth-child(n+9){animation-delay:.4s}
section.on>*{animation:fadeUp .45s both}
section.on>:nth-child(2){animation-delay:.06s}section.on>:nth-child(3){animation-delay:.12s}section.on>:nth-child(4){animation-delay:.18s}section.on>:nth-child(5){animation-delay:.24s}section.on>:nth-child(6){animation-delay:.3s}section.on>:nth-child(7){animation-delay:.36s}section.on>:nth-child(8){animation-delay:.42s}section.on>:nth-child(n+9){animation-delay:.48s}
section#chat.on>*{animation:fadeIn .3s both}
.months .mo{animation:fadeUp .4s both}
.months .mo:nth-child(2){animation-delay:.03s}.months .mo:nth-child(3){animation-delay:.06s}.months .mo:nth-child(4){animation-delay:.09s}.months .mo:nth-child(5){animation-delay:.12s}.months .mo:nth-child(6){animation-delay:.15s}.months .mo:nth-child(7){animation-delay:.18s}.months .mo:nth-child(8){animation-delay:.21s}.months .mo:nth-child(9){animation-delay:.24s}.months .mo:nth-child(10){animation-delay:.27s}.months .mo:nth-child(11){animation-delay:.3s}.months .mo:nth-child(12){animation-delay:.33s}
.bars i{transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.m.new.u{animation:bubR .3s cubic-bezier(.2,.8,.2,1) both}.m.new.b{animation:bubL .3s cubic-bezier(.2,.8,.2,1) both}
.m.typing::after{content:'';animation:dots 1.2s steps(1) infinite}
.btn{transition:transform .15s,box-shadow .2s,background-color .2s,color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,42,68,.15)}
.btn:active:not(:disabled){transform:scale(.96)}
.item{transition:transform .2s,box-shadow .2s,border-color .2s}.item i{transition:transform .3s}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,42,68,.12);border-color:var(--ice)}.item:hover i{transform:rotate(-10deg) scale(1.12)}

.card{transition:transform .2s,box-shadow .2s}
.chips button{transition:background-color .2s,color .2s,transform .15s}.chips button:hover{background:var(--d7);color:#fff}.chips button:active{transform:scale(.95)}

input,select,textarea{transition:border-color .2s,box-shadow .2s}

.calhoje{color:var(--soft);font-size:14px;margin:0 0 10px}.calhoje::first-letter{text-transform:uppercase}

.brand{display:flex;align-items:center;gap:8px}.brand img{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}

 if(v.cracks)for(let i=0;i<5;i++){let x=10+i*24+R()*8,y=14,d=`M${x.toFixed(1)} ${y}`;while(y<H){y+=8+R()*8;x+=R()*12-6;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}o+=`<path d="${d}" stroke="#5C2410" stroke-width="1.6" fill="none" stroke-linecap="round"/>`}
 if(v.roots)for(let i=0;i<4;i++){const x=15+i*30+R()*10;o+=`<path d="M${x} 10 q${R()*16-8} 18 ${R()*10-5} 32 q${R()*12-6} 12 ${R()*14-7} 26" stroke="#D9BF95" stroke-width="1.3" fill="none" opacity=".8"/>`}
 if(v.fibers)for(let i=0;i<40;i++){const x=R()*W,y=14+R()*(H-14),l=3+R()*6,ang=R()*Math.PI;o+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+Math.cos(ang)*l).toFixed(1)}" y2="${(y+Math.sin(ang)*l).toFixed(1)}" stroke="#7A5A3E" stroke-width="1"/>`}
 if(v.stones)for(let i=0;i<14;i++){const c=['#C9C1B4','#8F8A80','#DDD6CA','#A79F92'][i%4];o+=`<ellipse cx="${(R()*W).toFixed(1)}" cy="${(18+R()*(H-18)).toFixed(1)}" rx="${(3+R()*7).toFixed(1)}" ry="${(2.5+R()*4).toFixed(1)}" fill="${c}" stroke="#5E554A" stroke-width=".8"/>`}
 o+=`<rect width="${W}" height="10" fill="#8DB255"/>`;for(let x=2;x<W;x+=5)o+=`<path d="M${x} 10 l${(R()*3-1.5).toFixed(1)} -${(4+R()*6).toFixed(1)}" stroke="#6E9440" stroke-width="1.4" stroke-linecap="round"/>`;
 return o+'</svg>'}
function soilPic(s){return s.v?`<img src="img/${s.id}.jpg" alt="" loading="lazy" onerror="this.outerHTML=soilSvg(SOILS.find(x=>x.id=='${s.id}'))">`:soilSvg(s)}
async function loadSoils(){const a=+$('lat').value,o=+$('lon').value;if(!a&&!o){soil={key:'',state:'fail',list:[]};return renderSoils()}
 const key=a.toFixed(2)+','+o.toFixed(2);if(soil.key==key&&soil.state!='fail')return renderSoils();
 soil={key,state:'loading',list:[]};renderSoils();
 try{let d=null;try{d=JSON.parse(localStorage.getItem('soil:'+key))}catch(e){}
  if(!d){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
   const r=await fetch(`https://rest.isric.org/soilgrids/v2.0/classification/query?lon=${o}&lat=${a}&number_classes=8`,{signal:ac.signal});clearTimeout(tm);
   if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json();try{localStorage.setItem('soil:'+key,JSON.stringify(d))}catch(e){}}
  const list=(d.wrb_class_probability||[]).filter(x=>x[1]>=5&&WRB[x[0]]).map(([w,p])=>({w,p,t:WRB[w][0]}));
  if(soil.key!=key)return;soil={key,state:list.length?'ok':'fail',list}}
 catch(e){if(soil.key==key)soil={key,state:'fail',list:[]}}
 renderSoils()}

function renderSoils(){if(!$('soils'))return;const ok=soil.state=='ok';
 const score={};soil.list.forEach(x=>score[x.t]=(score[x.t]||0)+x.p);
 let L2=[...SOILS].filter(s=>s.id!='naosei').sort((x,y)=>(score[y.id]||0)-(score[x.id]||0));
 const reg=L2.filter(s=>score[s.id]);
 const forced=!!(soilSel&&soilSel!='naosei'&&!score[soilSel]),showAll=!ok||soilAll||!reg.length||forced;
 if(!showAll)L2=reg;L2.push(SOILS.find(s=>s.id=='naosei'));
 const names={};soil.list.forEach(x=>{const nm=wrbName(x.w);names[nm]=(names[nm]||0)+x.p});
 const top=Object.entries(names).sort((x,y)=>y[1]-x[1]).slice(0,4).map(([nm,p])=>`${esc(nm)} (${p}%)`).join(', ');
 $('soilNote').innerHTML=soil.state=='loading'?`${t('soilLoading')}<div class="loadbar"></div>`
  :ok?`${t('soilPick')}<br><b>${t('soilRegion')}</b>${top}.<small>${t('soilSrc')}</small>`
  :soil.state=='fail'?`${t('soilPick')}<small>${t('soilFail')}</small>`:t('soilPick');
 $('soils').innerHTML=L2.map(s=>`<button type="button" class="soil" data-soil="${s.id}" aria-pressed="${s.id==soilSel}">${soilPic(s)}${ok&&score[s.id]?`<span class="reg">${t('soilCommon')}</span>`:''}<b>${esc(s.n[lang])}</b><small>${esc(s.h[lang])}</small></button>`).join('')
  +(ok&&!forced&&reg.length&&reg.length<SOILS.length-1?`<button type="button" class="btn t soilmore" data-more="1">${showAll?t('soilLess'):t('soilMore')}</button>`:'');
 if(soilSel)$('solo').value=soilName(soilSel)}
$('soils').onclick=e=>{const m=e.target.closest('[data-more]');if(m){soilAll=!soilAll;return renderSoils()}
 const b=e.target.closest('.soil');if(!b)return;soilSel=b.dataset.soil;$('solo').value=soilName(soilSel);
 $('soils').querySelectorAll('.soil').forEach(x=>x.setAttribute('aria-pressed',x==b))};
function soilFromText(v){if(!v)return'';const s=SOILS.find(s=>Object.values(s.n).includes(v));return s?s.id:''}
/* ---------- Início ---------- */
function renderHome(){const p=S.profile,n=S.nasa;
 $('home').innerHTML=`<div class="card"><h1>${t('hi')}${esc(p.nome)}!</h1><span style="color:var(--soft)">📍 ${esc(p.cidade)}${p.uf?', '+esc(p.uf):''}</span></div>
 ${[['chat','💬','cChat'],['recs','🌱','cRecs'],['cal','📅','cCal'],['faq','❓','cFaq']].map(a=>`<button class="item" onclick="go('${a[0]}')"><i aria-hidden="true">${a[1]}</i>${t(a[2])}</button>`).join('')}
 <h2 style="margin-top:20px">${t('climate')}</h2>`+(n?`
 <div class="warn">${t('warn')}${esc(n.periodo)}.</div>
 <div class="stat"><div><b>${n.tempMedia??'–'} °C</b><span>${t('temp')}</span></div><div><b>${n.chuvaTotalMm} mm</b><span>${t('rain')}</span></div><div><b>${n.radiacaoMedia??'–'}</b><span>${t('rad')}</span></div></div>
 <div class="card"><b>${t('rainDay')}</b><div class="bars" role="img" aria-label="${t('rainDay')}">${(()=>{const mx=Math.max(...n.days.map(d=>d.p||0),1);return n.days.map((d,i)=>`<i title="${d.d}: ${d.p??0} mm" style="height:${Math.max(2,(d.p||0)/mx*80)}px;animation-delay:${i*12}ms"></i>`).join('')})()}</div></div>
 <p style="font-size:14px;color:var(--soft)">${t('smap')}</p>`
 :`<div class="warn">${t('nasaFail')}${S.nasaErro?': '+esc(S.nasaErro):''}.</div>`)+`<button class="btn s" onclick="editar()">${t('edit')}</button>`}

/* ---------- Chat ---------- */
$('chips').onclick=e=>{if(e.target.tagName=='BUTTON'){$('q').value=e.target.textContent;enviar()}};
let seen=-1;
function renderMsgs(){const nw=i=>seen>=0&&i>=seen?' new':'';$('msgs').innerHTML=S.messages.length?S.messages.map((m,i)=>m.role=='user'?`<div class="m u${nw(i)}">${esc(m.text)}</div>`:`<div class="m b${nw(i)}">${esc(m.text)}<br><button class="say" data-i="${i}" aria-label="${t('listen')}">🔊</button></div>`).join(''):`<div class="m b new">${t('intro')}</div>`;seen=S.messages.length}
$('msgs').onclick=e=>{const b=e.target.closest('.say');if(b)falar(S.messages[+b.dataset.i].text)};
function add(c,x){const d=document.createElement('div');d.className='m new '+c;d.textContent=x;$('msgs').appendChild(d);d.scrollIntoView();return d}
async function enviar(){const m=$('q').value.trim();if(!m||busy)return;busy=true;$('send').disabled=true;$('q').value='';
 add('u',m);seen=S.messages.length+1;const l=add('b',t('thinking').replace(/…$/,''));l.classList.add('typing');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,lang})}),d=await r.json();
  if(!r.ok)throw new Error(d.error||'');
  await refresh();if(d.recs?.length)add('b',t('created'));$('msgs').lastElementChild?.scrollIntoView()
 }catch(e){l.classList.remove('typing');l.textContent=t('fail')+e.message}
 busy=false;$('send').disabled=false}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert(t('novoice'));
 const r=new R(),b=$('mic');r.lang=LOC[lang];b.textContent='⏺';
 r.onresult=e=>{$('q').value=e.results[0][0].transcript;enviar()};r.onend=r.onerror=()=>b.textContent='🎤';r.start()}
function falar(x){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=LOC[lang];speechSynthesis.speak(u)}

/* ---------- Sugestões ---------- */
const ord={pendente:0,aprovada:1,arquivada:2,recusada:3};
function renderRecs(){const R=[...S.recs].sort((a,b)=>ord[a.status]-ord[b.status]);
 $('recs').innerHTML=`<h2>${t('recsT')}</h2>`+(R.length?R.map(r=>`<div class="card ${r.status}"><h3>${esc(r.titulo)} <span class="tag">${t('st')[r.status]}</span></h3>
 <p>${esc(r.motivo)}</p><p><b>🌿 ${t('ben')}:</b> ${esc(r.beneficios)}</p><p><b>🗓️ ${t('per')}:</b> ${esc(r.periodo)}</p>
 ${(r.etapas||[]).length?`<ol>${r.etapas.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>`:''}${r.custos?`<p><b>💰 ${t('cost')}:</b> ${esc(r.custos)}</p>`:''}
 <div class="warn">${t('conf')}: ${esc(r.confianca)}. ${esc(r.limitacoes)}</div>
 ${r.status=='pendente'?`<button class="btn p" onclick="decidir('${r.id}','aprovada')">${t('approve')}</button><button class="btn s" onclick="decidir('${r.id}','recusada')">${t('reject')}</button><button class="btn t" onclick="decidir('${r.id}','arquivada')">${t('archive')}</button>`:''}</div>`).join(''):`<p>${t('noRecs')}</p>`)}
async function decidir(id,status){let motivo;if(status=='recusada')motivo=prompt(t('why'));
 await fetch('/api/rec/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,motivo})});refresh()}

/* ---------- Calendário anual ---------- */
function renderCal(){const now=new Date(),y0=now.getFullYear(),m0=now.getMonth(),lc=LOC[lang],MN=(y,m)=>new Date(y,m,1).toLocaleString(lc,{month:'long'});
 const WD=[...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleString(lc,{weekday:'short'})[0].toUpperCase());
 const ap=S.recs.filter(r=>r.status=='aprovada'),mk={};
 ap.forEach(r=>{const s=(+r.mes_inicio||0)-1;if(s<0||s>11)return;for(let i=0;i<Math.max(1,+r.duracao_meses||1);i++){const m=(s+i)%12;(mk[m]=mk[m]||{}).p=1;if(!i)mk[m].s=1}});
 const fim=new Date(y0,m0+11,1),HJ={pt:'Hoje',en:'Today',es:'Hoy'}[lang];
 let h=`<h2>${t('calT')}${MN(y0,m0)} ${y0} – ${MN(fim.getFullYear(),fim.getMonth())} ${fim.getFullYear()}</h2><p class="calhoje">📍 ${HJ}: ${now.toLocaleDateString(lc,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><div class="months">`;
 for(let k=0;k<12;k++){const dt=new Date(y0,m0+k,1),y=dt.getFullYear(),m=dt.getMonth(),off=(dt.getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  h+=`<div class="mo"><h3>${MN(y,m)}${y!=y0?' '+y:''}</h3><div class="g">${WD.map(d=>`<span class="h">${d}</span>`).join('')}${'<span class="e"></span>'.repeat(off)}`;
  for(let d=1;d<=nd;d++){const c=(mk[m]?.s&&d==1?'s':mk[m]?.p?'p':'')+(k==0&&d==now.getDate()?' today':'');h+=`<span class="${c}"${c.includes('today')?` title="${HJ}"`:''}>${d}</span>`}
  h+='</div></div>'}
 h+=`</div><h3 style="margin-top:16px">${t('appr')}</h3>`;
 h+=ap.length?ap.map(r=>`<div class="card aprovada"><b>${esc(r.titulo)}</b><br>📅 ${t('startm')}: ${(+r.mes_inicio>=1&&+r.mes_inicio<=12)?MN(y0,+r.mes_inicio-1):'–'} · ${esc(r.duracao_meses)} ${t('months')}${(r.etapas||[]).length?`<ol>${r.etapas.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>`:''}</div>`).join(''):`<p>${t('noAppr')}</p>`;
 $('cal').innerHTML=h}
function renderFaq(){$('faq').innerHTML=`<h2>${t('faqT')}</h2>`+t('faq').map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('')}

applyLang();refresh();
</script></body></html>
