<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Audaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pist:#B9C255;--frost:#E6F1FA;--ice:#5798D7;--deep:#0F2A44;--d7:#2B6AAE;--soft:#566A80;--line:#CFE3F3;--err:#B3261E;--warnbg:#FFF1D6;--warn:#8A5300}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--frost);color:var(--deep);padding-bottom:76px}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;line-height:1.2;margin:0 0 8px}h1{font-size:24px}h2{font-size:20px}h3{font-size:18px}
:focus-visible{outline:2px solid var(--deep);outline-offset:4px}
header{background:var(--d7);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font:700 20px 'Bricolage Grotesque',sans-serif}
header select{width:auto;min-height:44px;background:#fff;font-size:14px}
.pad{padding:16px;max-width:640px;margin:auto}section,.view{display:none}.on{display:block}
.photo{height:230px;background:url(hero.jpg) center/cover,linear-gradient(135deg,#2B6AAE,#5798D7 60%,#B9C255)}
.sheet{background:#fff;border-radius:24px 24px 0 0;margin-top:-28px;padding:24px 20px 32px;text-align:center;position:relative;max-width:640px;margin-inline:auto;min-height:55vh}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--line);margin:-66px auto 12px;display:flex;align-items:center;justify-content:center;font:700 32px 'Bricolage Grotesque';color:var(--d7);border:4px solid #fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 4px rgba(15,42,68,.1)}
.card.aprovada{border:2px solid var(--pist);background:#F8FAE8}.card.recusada,.card.arquivada{opacity:.75}
label{display:block;margin:14px 0 4px;font-size:14px;color:var(--soft);font-weight:500;text-align:left}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;font:16px Inter,sans-serif;color:var(--deep);background:#F7FAFD;border:1px solid #7C93AB;border-radius:8px}
.btn{min-height:48px;min-width:44px;padding:10px 18px;border-radius:8px;font:600 16px Inter,sans-serif;cursor:pointer;border:2px solid var(--d7);margin:8px 8px 0 0}
.p{background:var(--d7);color:#fff}.s{background:#fff;color:var(--d7)}.t{background:var(--frost);color:var(--d7);border-color:transparent}
.a{background:var(--pist);color:var(--deep);border-color:var(--pist)}.big{width:100%;margin:20px 0 0}
.btn:disabled{background:#EEF2F6;color:#5F7389;border-color:#EEF2F6}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}.row .btn{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(15,42,68,.1)}
nav button{flex:1;min-height:60px;border:0;background:none;font:500 12px Inter,sans-serif;color:var(--soft);cursor:pointer;border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--d7);font-weight:600;border-top-color:var(--d7)}
.dots{display:flex;gap:8px;justify-content:center;margin:20px 0 12px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid #7C93AB}.dots i.on{background:var(--d7);border-color:var(--d7)}
.nav2{display:flex;justify-content:space-between}.nav2 .btn{margin:0}
iframe{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.err{color:var(--err);font-size:14px;text-align:left}.warn{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0;text-align:left}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font:600 17px Inter;color:var(--deep);cursor:pointer;text-align:left}
.item i{flex:none;width:48px;height:48px;border-radius:50%;background:var(--frost);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.stat{display:flex;gap:8px}.stat>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font:700 20px 'Bricolage Grotesque';color:var(--d7)}.stat span{font-size:12px;color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:1px;height:80px}.bars i{flex:1;background:var(--ice);min-height:2px;border-radius:2px 2px 0 0}
#msgs{min-height:45vh;display:flex;flex-direction:column}
.m{max-width:85%;padding:10px 12px;margin:5px 0;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--d7);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}.b{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:2px}
.say{background:none;border:0;font-size:18px;cursor:pointer;min-width:44px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{min-height:44px;padding:8px 12px;border-radius:22px;border:1px solid var(--d7);background:#fff;color:var(--d7);font:500 14px Inter;cursor:pointer}
#bar{position:sticky;bottom:68px;display:flex;gap:6px;background:var(--frost);padding:8px 0}#bar input{flex:1}#bar .btn{margin:0;padding:10px 14px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--frost);color:var(--d7)}
.months{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.mo h3{font-size:14px;margin:0 0 4px;text-transform:capitalize}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.g span{padding:2px 0;border-radius:3px;background:#F1F4D0}.g .h{background:none;color:var(--soft);font-weight:600}.g .e{background:none}
.g .p{background:var(--ice);color:var(--deep)}.g .s{background:var(--deep);color:#fff;font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0}summary{padding:14px 16px;font-weight:600;cursor:pointer;min-height:48px}details p{margin:0;padding:0 16px 14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><span>🌱 Audaz</span><select id="lang" aria-label="Language" onchange="setLang(this.value)"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></header>

<!-- BOAS-VINDAS -->
<div id="welcome" class="view"><div class="photo"></div><div class="sheet"><div class="avatar" aria-hidden="true">🌱</div>
 <h1 data-i="wT"></h1><p data-i="wX" style="color:var(--soft)"></p><button class="btn a big" onclick="begin()" data-i="start"></button></div></div>

<!-- CADASTRO -->
<div id="onb" class="view"><div class="photo" style="height:120px"></div><div class="sheet" style="min-height:0">
 <div class="avatar" id="av">?</div>
 <div class="step" data-s="0">
  <label for="nome" data-i="name"></label><input id="nome" autocomplete="name" oninput="$('av').textContent=(this.value.trim()[0]||'?').toUpperCase()">
  <label for="cidade" data-i="city"></label>
  <div class="row"><input id="cidade"><button class="btn a" type="button" onclick="buscar()" data-i="search"></button></div>
  <button class="btn t" type="button" onclick="gps()" data-i="gps"></button>
  <p id="loc" role="status" style="margin:8px 0 0;text-align:left"></p>
  <iframe id="map" title="Map" hidden></iframe>
  <input id="uf" type="hidden"><input id="lat" type="hidden"><input id="lon" type="hidden">
 </div>
 <div class="step" data-s="1" hidden>
  <h2 data-i="s2"></h2>
  <label for="atual" data-i="crop"></label><input id="atual">
  <label for="desejo" data-i="wish"></label><input id="desejo">
  <label for="obj" data-i="goal"></label><select id="obj"></select>
 </div>
 <div class="step" data-s="2" hidden>
  <h2 data-i="s3"></h2>
  <label for="solo" data-i="soil"></label><select id="solo"></select>
  <label for="agua" data-i="water"></label><select id="agua"></select>
  <label for="dif" data-i="diff"></label><textarea id="dif" rows="3"></textarea>
 </div>
 <div class="dots" id="dots" role="img"><i class="on"></i><i></i><i></i></div>
 <div class="nav2"><button class="btn s" id="bv" type="button" onclick="passo(-1)" data-i="back"></button><button class="btn p" id="bn" type="button" onclick="passo(1)"></button></div>
 <p id="st" role="status"></p></div></div>

<!-- APP -->
<div id="app" class="view"><div class="pad">
 <section id="home"></section>
 <section id="chat"><div id="msgs" aria-live="polite"></div><div class="chips" id="chips"></div>
  <div id="bar"><input id="q" data-ph="ask" onkeydown="if(event.key=='Enter')enviar()"><button class="btn s" id="mic" type="button" onclick="mic()">🎤</button><button class="btn p" id="send" type="button" onclick="enviar()">➤</button></div></section>
 <section id="recs"></section><section id="cal"></section><section id="faq"></section>
</div></div>
<nav id="nav" hidden></nav>

    const AUD_USER_ID =

localStorage.setItem("audaz_user_id", AUD_USER_ID);

const originalFetch = window.fetch.bind(window);

window.fetch = (input, init = {}) => {
  const url = typeof input === "string" ? input : input.url;

  if (url.startsWith("/api/")) {
    const headers = new Headers(
      init.headers || (input instanceof Request ? input.headers : undefined)
    );

    headers.set("x-audaz-user", AUD_USER_ID);

    return originalFetch(input, { ...init, headers });
  }

  return originalFetch(input, init);
};

 const onb=!S.profile||editing;
 $('welcome').classList.toggle('on',!S.profile&&!started&&!editing);$('onb').classList.toggle('on',onb&&(started||editing||!!S.profile));
 $('app').classList.toggle('on',!onb);$('nav').hidden=onb;
 if(!onb){renderHome();renderMsgs();renderRecs();renderCal();renderFaq();go(cur)}}
function begin(){started=true;refresh()}

/* ---------- Cadastro ---------- */
const F=['nome','cidade','uf','lat','lon','atual','desejo','solo','agua','dif','obj'];
function mapa(){const a=+$('lat').value,o=+$('lon').value;if(!a&&!o)return;const f=$('map');f.hidden=false;
 f.src=`https://www.openstreetmap.org/export/embed.html?bbox=${o-.2},${a-.15},${o+.2},${a+.15}&layer=mapnik&marker=${a},${o}`;
 $('loc').className='';$('loc').textContent=`📍 ${$('cidade').value||''} (${a.toFixed(3)}, ${o.toFixed(3)})`}
async function buscar(){const q=$('cidade').value.trim();if(!q)return;$('loc').className='';$('loc').textContent=t('searching');
 const r=await fetch(`/api/geocode?q=${encodeURIComponent(q)}&lang=${lang}`),d=await r.json();
 if(!r.ok){$('loc').className='err';$('loc').textContent=t('notfound');return}
 $('cidade').value=d.cidade;$('uf').value=d.uf;$('lat').value=d.lat;$('lon').value=d.lon;mapa()}
function gps(){if(!navigator.geolocation){$('loc').className='err';$('loc').textContent=t('nogeo');return}
 navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;mapa()},()=>{$('loc').className='err';$('loc').textContent=t('nogeo')})}
function showStep(){document.querySelectorAll('.step').forEach(s=>s.hidden=+s.dataset.s!=step);
 [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i==step));$('dots').setAttribute('aria-label',`${step+1}/3`);
 $('bv').style.visibility=step?'visible':'hidden';$('bn').textContent=step==2?t('save'):t('next')}
function passo(d){
 if(d>0&&step==0&&(!$('nome').value.trim()||!$('lat').value)){$('loc').className='err';$('loc').textContent=t('needLoc');return}
 if(d>0&&step==2)return salvar();
 step=Math.max(0,Math.min(2,step+d));showStep()}
async function salvar(){const p={};F.forEach(k=>p[k]=$(k).value);p.lat=+p.lat;p.lon=+p.lon;
 $('bn').disabled=true;$('st').textContent=t('nasaWait');
 try{await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});editing=false;step=0;cur='home';$('st').textContent=''}
 catch(e){$('st').className='err';$('st').textContent='⚠ '+e.message}
 $('bn').disabled=false;showStep();refresh()}
function editar(){editing=true;step=0;F.forEach(k=>{const v=S.profile?.[k];if(v!==undefined)$(k).value=v});
 $('av').textContent=(($('nome').value.trim()[0])||'?').toUpperCase();showStep();mapa();refresh()}

/* ---------- Início ---------- */
function renderHome(){const p=S.profile,n=S.nasa;
 $('home').innerHTML=`<div class="card"><h1>${t('hi')}${esc(p.nome)}!</h1><span style="color:var(--soft)">📍 ${esc(p.cidade)}${p.uf?', '+esc(p.uf):''}</span></div>
 ${[['chat','💬','cChat'],['recs','🌱','cRecs'],['cal','📅','cCal'],['faq','❓','cFaq']].map(a=>`<button class="item" onclick="go('${a[0]}')"><i aria-hidden="true">${a[1]}</i>${t(a[2])}</button>`).join('')}
 <h2 style="margin-top:20px">${t('climate')}</h2>`+(n?`
 <div class="warn">${t('warn')}${esc(n.periodo)}.</div>
 <div class="stat"><div><b>${n.tempMedia??'–'} °C</b><span>${t('temp')}</span></div><div><b>${n.chuvaTotalMm} mm</b><span>${t('rain')}</span></div><div><b>${n.radiacaoMedia??'–'}</b><span>${t('rad')}</span></div></div>
 <div class="card"><b>${t('rainDay')}</b><div class="bars" role="img" aria-label="${t('rainDay')}">${(()=>{const mx=Math.max(...n.days.map(d=>d.p||0),1);return n.days.map(d=>`<i title="${d.d}: ${d.p??0} mm" style="height:${Math.max(2,(d.p||0)/mx*80)}px"></i>`).join('')})()}</div></div>
 <p style="font-size:14px;color:var(--soft)">${t('smap')}</p>`
 :`<div class="warn">${t('nasaFail')}${S.nasaErro?': '+esc(S.nasaErro):''}.</div>`)+`<button class="btn s" onclick="editar()">${t('edit')}</button>`}

/* ---------- Chat ---------- */
$('chips').onclick=e=>{if(e.target.tagName=='BUTTON'){$('q').value=e.target.textContent;enviar()}};
function renderMsgs(){$('msgs').innerHTML=S.messages.length?S.messages.map((m,i)=>m.role=='user'?`<div class="m u">${esc(m.text)}</div>`:`<div class="m b">${esc(m.text)}<br><button class="say" data-i="${i}" aria-label="${t('listen')}">🔊</button></div>`).join(''):`<div class="m b">${t('intro')}</div>`}
$('msgs').onclick=e=>{const b=e.target.closest('.say');if(b)falar(S.messages[+b.dataset.i].text)};
function add(c,x){const d=document.createElement('div');d.className='m '+c;d.textContent=x;$('msgs').appendChild(d);d.scrollIntoView();return d}
async function enviar(){const m=$('q').value.trim();if(!m||busy)return;busy=true;$('send').disabled=true;$('q').value='';
 add('u',m);const l=add('b',t('thinking'));
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,lang})}),d=await r.json();
  if(!r.ok)throw new Error(d.error||'');
  await refresh();if(d.recs?.length)add('b',t('created'));$('msgs').lastElementChild?.scrollIntoView()
 }catch(e){l.textContent=t('fail')+e.message}
 busy=false;$('send').disabled=false}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert(t('novoice'));
 const r=new R(),b=$('mic');r.lang=LOC[lang];b.textContent='⏺';
 r.onresult=e=>{$('q').value=e.results[0][0].transcript;enviar()};r.onend=r.onerror=()=>b.textContent='🎤';r.start()}
function falar(x){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=LOC[lang];speechSynthesis.speak(u)}

/* ---------- Sugestões ---------- */
const ord={pendente:0,aprovada:1,arquivada:2,recusada:3};
function renderRecs(){const R=[...S.recs].sort((a,b)=>ord[a.status]-ord[b.status]);
 $('recs').innerHTML=`<h2>${t('recsT')}</h2>`+(R.length?R.map(r=>`<div class="card ${r.status}"><h3>${esc(r.titulo)} <span class="tag">${t('st')[r.status]}</span></h3>
 <p>${esc(r.motivo)}</p><p><b>🌿 ${t('ben')}:</b> ${esc(r.beneficios)}</p><p><b>🗓️ ${t('per')}:</b> ${esc(r.periodo)}</p>
 ${(r.etapas||[]).length?`<ol>${r.etapas.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>`:''}${r.custos?`<p><b>💰 ${t('cost')}:</b> ${esc(r.custos)}</p>`:''}
 <div class="warn">${t('conf')}: ${esc(r.confianca)}. ${esc(r.limitacoes)}</div>
 ${r.status=='pendente'?`<button class="btn p" onclick="decidir('${r.id}','aprovada')">${t('approve')}</button><button class="btn s" onclick="decidir('${r.id}','recusada')">${t('reject')}</button><button class="btn t" onclick="decidir('${r.id}','arquivada')">${t('archive')}</button>`:''}</div>`).join(''):`<p>${t('noRecs')}</p>`)}
async function decidir(id,status){let motivo;if(status=='recusada')motivo=prompt(t('why'));
 await fetch('/api/rec/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,motivo})});refresh()}

/* ---------- Calendário anual ---------- */
function renderCal(){const y=new Date().getFullYear(),lc=LOC[lang],MN=m=>new Date(y,m,1).toLocaleString(lc,{month:'long'});
 const WD=[...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleString(lc,{weekday:'short'})[0].toUpperCase());
 const ap=S.recs.filter(r=>r.status=='aprovada'),mk={};
 ap.forEach(r=>{const s=(+r.mes_inicio||0)-1;if(s<0||s>11)return;for(let i=0;i<Math.max(1,+r.duracao_meses||1);i++){const m=(s+i)%12;(mk[m]=mk[m]||{}).p=1;if(!i)mk[m].s=1}});
 let h=`<h2>${t('calT')}${y}</h2><div class="months">`;
 for(let m=0;m<12;m++){const off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  h+=`<div class="mo"><h3>${MN(m)}</h3><div class="g">${WD.map(d=>`<span class="h">${d}</span>`).join('')}${'<span class="e"></span>'.repeat(off)}`;
  for(let d=1;d<=nd;d++)h+=`<span class="${mk[m]?.s&&d==1?'s':mk[m]?.p?'p':''}">${d}</span>`;h+='</div></div>'}
 h+=`</div><h3 style="margin-top:16px">${t('appr')}</h3>`;
 h+=ap.length?ap.map(r=>`<div class="card aprovada"><b>${esc(r.titulo)}</b><br>📅 ${t('startm')}: ${(+r.mes_inicio>=1&&+r.mes_inicio<=12)?MN(+r.mes_inicio-1):'–'} · ${esc(r.duracao_meses)} ${t('months')}${(r.etapas||[]).length?`<ol>${r.etapas.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>`:''}</div>`).join(''):`<p>${t('noAppr')}</p>`;
 $('cal').innerHTML=h}
function renderFaq(){$('faq').innerHTML=`<h2>${t('faqT')}</h2>`+t('faq').map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('')}

applyLang();refresh();
</script></body></html>
